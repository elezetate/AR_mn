<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <title>AR Target Test</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/examples/marker-training/threex-arpatternfile.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    #app,
    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #app {
      background: #000;
    }

    video,
    canvas,
    .a-canvas,
    .arjs-video {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      background: #000 !important;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.22);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .start-button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font: inherit;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.92);
      color: #111;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="overlay" class="overlay">
    <button id="start-button" class="start-button">Abrir camara</button>
  </div>

  <script>
    const TARGET_IMAGE = "target-test.svg";
    const MODEL_URL = "escultura_high_01.glb?v=targettest03";
    const PATTERN_RATIO = 0.5;
    const OFFSET_Z = -2;
    const MODEL_SCALE = "0.3 0.3 0.3";
    const MODEL_ROTATION = "0 180 0";

    const app = document.getElementById("app");
    const overlay = document.getElementById("overlay");
    const startButton = document.getElementById("start-button");

    let sceneMounted = false;
    let started = false;

    function showOverlay() {
      overlay.classList.add("visible");
    }

    function hideOverlay() {
      overlay.classList.remove("visible");
    }

    function fitMedia() {
      const mediaNodes = document.querySelectorAll("video, canvas, .a-canvas, .arjs-video");
      mediaNodes.forEach((node) => {
        node.style.position = "fixed";
        node.style.inset = "0";
        node.style.width = "100%";
        node.style.height = "100%";
        node.style.objectFit = "cover";
        node.style.background = "#000";
      });
    }

    function generatePattern(imageUrl) {
      return new Promise((resolve) => {
        THREEx.ArPatternFile.encodeImageURL(imageUrl, (patternFileString) => {
          const blob = new Blob([patternFileString], { type: "text/plain" });
          resolve(URL.createObjectURL(blob));
        });
      });
    }

    function mountScene(patternUrl) {
      if (sceneMounted) return;

      const scene = document.createElement("a-scene");
      scene.setAttribute("embedded", "");
      scene.setAttribute("vr-mode-ui", "enabled: false");
      scene.setAttribute("device-orientation-permission-ui", "enabled: false");
      scene.setAttribute("loading-screen", "enabled: false");
      scene.setAttribute(
        "renderer",
        "antialias: true; alpha: true; colorManagement: true; precision: mediump;"
      );
      scene.setAttribute(
        "arjs",
        "sourceType: webcam; facingMode: environment; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5;"
      );

      const assets = document.createElement("a-assets");
      const assetItem = document.createElement("a-asset-item");
      assetItem.setAttribute("id", "sculpture-glb");
      assetItem.setAttribute("src", MODEL_URL);
      assets.appendChild(assetItem);
      scene.appendChild(assets);

      const ambientLight = document.createElement("a-entity");
      ambientLight.setAttribute("light", "type: ambient; intensity: 1.15; color: #ffffff;");
      scene.appendChild(ambientLight);

      const dirLight = document.createElement("a-entity");
      dirLight.setAttribute("light", "type: directional; intensity: 1.2; color: #ffffff;");
      dirLight.setAttribute("position", "1 2 1");
      scene.appendChild(dirLight);

      const marker = document.createElement("a-marker");
      marker.setAttribute("type", "pattern");
      marker.setAttribute("url", patternUrl);
      marker.setAttribute("smooth", "true");
      marker.setAttribute("smoothCount", "10");
      marker.setAttribute("smoothTolerance", "0.01");
      marker.setAttribute("smoothThreshold", "5");
      marker.addEventListener("markerFound", hideOverlay);

      const model = document.createElement("a-entity");
      model.setAttribute("gltf-model", "#sculpture-glb");
      model.setAttribute("position", `0 0 ${OFFSET_Z}`);
      model.setAttribute("rotation", MODEL_ROTATION);
      model.setAttribute("scale", MODEL_SCALE);
      marker.appendChild(model);

      scene.appendChild(marker);

      const camera = document.createElement("a-entity");
      camera.setAttribute("camera", "");
      scene.appendChild(camera);

      app.appendChild(scene);
      sceneMounted = true;

      scene.addEventListener("loaded", () => {
        fitMedia();
        setTimeout(fitMedia, 500);
        setTimeout(fitMedia, 1200);
      });

      scene.addEventListener("renderstart", fitMedia);
      window.addEventListener("resize", fitMedia);
      window.addEventListener("orientationchange", () => {
        setTimeout(fitMedia, 250);
      });
    }

    async function startExperience() {
      if (started) return;
      started = true;
      hideOverlay();

      try {
        const patternUrl = await generatePattern(TARGET_IMAGE);
        mountScene(patternUrl);
      } catch (error) {
        console.error(error);
        started = false;
        showOverlay();
      }
    }

    window.addEventListener("load", async () => {
      await startExperience();
      setTimeout(() => {
        const video = document.querySelector("video");
        if (!video || video.readyState < 2) {
          showOverlay();
        }
      }, 1200);
    }, { once: true });

    startButton.addEventListener("click", () => {
      startExperience();
    });
  </script>
</body>
</html>
