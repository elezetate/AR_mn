<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Target Tracking Test</title>

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const TARGET_IMAGE_URL = "target-test.png?v=track04";
    const MODEL_URL = "escultura_high_01.glb?v=track04";

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    async function buildTargetFile() {
      const image = await loadImage(TARGET_IMAGE_URL);
      const compiler = new window.MINDAR.Compiler();
      await compiler.compileImageTargets([image], () => {});
      const buffer = await compiler.exportData();
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      return URL.createObjectURL(blob);
    }

    async function start() {
      try {
        const targetSrc = await buildTargetFile();

        document.getElementById("app").innerHTML = `
          <a-scene
            mindar-image="imageTargetSrc: ${targetSrc}; uiLoading: no; uiScanning: no; uiError: no;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-assets>
              <a-asset-item id="sculptureModel" src="${MODEL_URL}"></a-asset-item>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
              <a-gltf-model
                src="#sculptureModel"
                position="0 0 -2"
                rotation="0 180 0"
                scale="0.3 0.3 0.3">
              </a-gltf-model>
            </a-entity>
          </a-scene>
        `;
      } catch (error) {
        console.error("MindAR error", error);
      }
    }

    window.addEventListener("load", start, { once: true });
  </script>
</body>
</html>
