<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Target Tracking Option B</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetAnchor = document.getElementById("target-anchor");
      const trackedPlacement = document.getElementById("tracked-placement");
      const smoothedPlacement = document.getElementById("smoothed-placement");

      const targetPosition = new AFRAME.THREE.Vector3();
      const targetQuaternion = new AFRAME.THREE.Quaternion();
      const targetScale = new AFRAME.THREE.Vector3();

      let trackingActive = false;
      let holdUntil = 0;
      let hasPose = false;

      const syncTargetPose = () => {
        trackedPlacement.object3D.updateMatrixWorld(true);
        trackedPlacement.object3D.matrixWorld.decompose(
          targetPosition,
          targetQuaternion,
          targetScale
        );

        if (!hasPose) {
          smoothedPlacement.object3D.position.copy(targetPosition);
          smoothedPlacement.object3D.quaternion.copy(targetQuaternion);
          smoothedPlacement.object3D.scale.copy(targetScale);
          hasPose = true;
          return;
        }

        smoothedPlacement.object3D.position.lerp(targetPosition, 0.12);
        smoothedPlacement.object3D.quaternion.slerp(targetQuaternion, 0.12);
        smoothedPlacement.object3D.scale.lerp(targetScale, 0.12);
      };

      const tick = () => {
        if (trackingActive) {
          syncTargetPose();
          smoothedPlacement.object3D.visible = true;
        } else if (performance.now() < holdUntil && hasPose) {
          smoothedPlacement.object3D.visible = true;
        } else {
          smoothedPlacement.object3D.visible = false;
        }

        requestAnimationFrame(tick);
      };

      targetAnchor.addEventListener("targetFound", () => {
        trackingActive = true;
      });

      targetAnchor.addEventListener("targetLost", () => {
        trackingActive = false;
        holdUntil = performance.now() + 2500;
      });

      requestAnimationFrame(tick);
    }, { once: true });
  </script>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: targets-marina-v3.mind?v=optb02; maxTrack: 1; missTolerance: 35; warmupTolerance: 10; filterMinCF: 0.00001; filterBeta: 220;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="sculptureModel" src="escultura_high_01.glb?v=optb02"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="smoothed-placement" visible="false">
      <a-gltf-model
        src="#sculptureModel"
        position="0 0 0"
        rotation="0 180 0"
        scale="2.3 2.3 2.3">
      </a-gltf-model>
    </a-entity>

    <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
      <a-entity
        id="tracked-placement"
        position="0 0 -0.9"
        rotation="0 180 0"
        scale="2.3 2.3 2.3"
        visible="false">
        <a-gltf-model src="#sculptureModel"></a-gltf-model>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
